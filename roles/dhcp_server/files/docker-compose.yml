name: homelab

services:
  dhcp:
    build:
      context: .
      dockerfile: Dockerfile.dhcp
    restart: unless-stopped
    ports:
      - 67:67/udp
      - 647:647/tcp
      - 647:647/udp
    volumes:
      - ./kea-dhcp4.conf:/etc/kea/kea-dhcp4.conf:ro
    entrypoint: [ "/usr/sbin/kea-dhcp4" ]
    command: [ "-c", "/etc/kea/kea-dhcp4.conf" ]
